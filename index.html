<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подсказка капитана — Кодовые имена</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2A241F;--panel:#332C26;--panel2:#3A332C;--text:#EFE6D0;--muted:#B8AA92;--dim:#9C8F7A;--btn:#8C7A6B;
  --R:#D23A2A;--B:#2C5DA8;--Y:#E4D6A2;--K:#141414}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px))}
.app{max-width:760px;margin:0 auto}
h1{font-size:28px;font-weight:800;margin:0;color:#F5ECD6}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.startPill{border:0;color:#fff;font:inherit;font-weight:700;padding:2px 10px;border-radius:999px;cursor:pointer}
.scoreRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 14px}
.score{border-radius:10px;padding:10px 8px;display:flex;align-items:baseline;gap:6px;justify-content:center}
.scoreNum{font-size:26px;font-weight:800;line-height:1}
.scoreOf{font-size:12px;opacity:.8}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
button.tb{background:var(--btn);color:#FFF8EA;border:0;border-radius:8px;padding:9px 13px;font:500 14px 'Rubik',sans-serif;cursor:pointer}
button.tb.on{background:var(--text);color:var(--bg)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,li:focus-visible,.card:focus-visible{outline:2px solid #FFD66B;outline-offset:2px}
.note{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.4}
.busy{background:var(--panel2)}.err{background:#5A2620;color:#FFD9D2}.warn{background:#4A3F24;color:#FFEFB8}
.hidden{display:none!important}
.tabs{display:flex;margin:20px 0 6px;border-bottom:2px solid #4A4038}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 15px 'Rubik',sans-serif;padding:10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.active{color:#F5ECD6;border-bottom-color:#F5ECD6}
.hint{font-size:13px;color:var(--dim);margin:8px 0 10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{aspect-ratio:1.45;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;cursor:pointer;transition:opacity .2s,filter .2s;overflow:hidden}
.card.opened{opacity:.28;filter:saturate(.4)}
.card.opened .word{text-decoration:line-through}
.word{font-weight:700;font-size:clamp(9px,2.6vw,15px);text-align:center;word-break:break-word;line-height:1.1}
.word.long{font-size:clamp(7px,1.9vw,12px)}
a{color:#FFD66B}
.editor{margin-top:16px;background:var(--panel);border-radius:10px;padding:14px}
.editor p{margin:0 0 12px;font-size:14px;color:var(--muted);line-height:1.45}
.editRow{margin-bottom:14px}
.editRow h3{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--dim)}
.editItem{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.swatch{flex:none;width:40px;height:40px;border-radius:8px;border:2px solid rgba(255,255,255,.25);cursor:pointer}
.wordEdit{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid #5A4F45;border-radius:8px;padding:10px;font:500 16px 'Rubik',sans-serif;text-transform:uppercase}
.done{width:100%;margin-top:6px;background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:12px;font:700 15px 'Rubik',sans-serif;cursor:pointer}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.list{border:2px solid;border-radius:10px;overflow:hidden;background:var(--panel)}
.list h2{margin:0;font-size:15px;font-weight:700;padding:9px 12px;display:flex;justify-content:space-between}
.list ul{list-style:none;margin:0;padding:6px 0}
.list li{padding:7px 12px;font-weight:500;font-size:15px;cursor:pointer;letter-spacing:.02em}
.list li.opened{opacity:.35;text-decoration:line-through}
a{color:#FFD66B}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Подсказка капитана</h1>
    <p class="sub">Первыми ходят <button id="startPill" class="startPill" title="Нажмите, чтобы сменить"></button></p>
  </header>

  <section class="scoreRow" id="scoreRow"></section>

  <section class="toolbar">
    <button class="tb" id="btnWords">Фото слов</button>
    <button class="tb" id="btnKey">Фото ключа</button>
    <button class="tb" id="btnRotate" title="Если карта-ключ лежала боком">Повернуть ключ</button>
    <button class="tb" id="btnEdit">Править</button>
    <input id="fileWords" type="file" accept="image/*" hidden>
    <input id="fileKey" type="file" accept="image/*" hidden>
  </section>

  <div id="noteBusy" class="note busy hidden"></div>
  <div id="noteErr" class="note err hidden"></div>
  <div id="noteWarn" class="note warn hidden"></div>

  <section id="editor" class="editor hidden">
    <p>Исправьте слова и цвета. Квадратик слева меняет цвет клетки по кругу: красный, синий, жёлтый, чёрный. Порядок — как карточки лежат на столе, ряды сверху вниз.</p>
    <div id="editList"></div>
    <button class="done" id="btnDone">Готово</button>
  </section>

  <nav class="tabs" id="tabs">
    <button id="tabTable" class="active">Как на столе</button>
    <button id="tabLists">Списки</button>
  </nav>

  <section id="viewTable">
    <p class="hint" id="hint"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="viewLists" class="hidden">
    <div class="lists" id="lists"></div>
  </section>

</div>

<script>
// Адрес вашего воркера Cloudflare (вставьте свой после создания воркера)
const WORKER_URL = "https://codenames-ocr.vwm4hczm8w.workers.dev";

const DEFAULT_WORDS = [
  "ФОРМА","КЕНТАВР","ПОЛЕ","ТРИП","ЛЕС",
  "ВЕК","ПОКРОВ","ПЛАТЬЕ","ДРЯНЬ","БУТЫЛКА",
  "КИШКА","РУКАВ","ПЕРЕВОД","ЛУНКА","ТЕЛЕСКОП",
  "БОЧКА","ЭЛЬФ","КУЛАК","БОКС","СТЕРИЛИЗАЦИЯ",
  "ГАЛОП","КОНТРАБАНДИСТ","ЕСТЬ","КАВАЛЕР","ВИД"
];
const DEFAULT_KEY = [
  "R","B","Y","B","B",
  "Y","B","R","R","Y",
  "K","R","B","B","R",
  "Y","R","R","Y","B",
  "Y","B","R","Y","R"
];
const COLORS = {
  R:{name:"Красные",bg:"#D23A2A",fg:"#fff",ring:"#FF8A73"},
  B:{name:"Синие",bg:"#2C5DA8",fg:"#fff",ring:"#8DB5F0"},
  Y:{name:"Мирные (жёлтые)",bg:"#E4D6A2",fg:"#3A3226",ring:"#FFF3C4"},
  K:{name:"Убийца (чёрная)",bg:"#141414",fg:"#F2EAD3",ring:"#8C8C8C"}
};
const ORDER = ["R","B","Y","K"];

// ---------- состояние ----------
function load(name, fallback){
  try{ const v = localStorage.getItem("cn_"+name); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function save(){
  try{
    localStorage.setItem("cn_words", JSON.stringify(state.words));
    localStorage.setItem("cn_key", JSON.stringify(state.key));
    localStorage.setItem("cn_start", JSON.stringify(state.start));
    localStorage.setItem("cn_opened", JSON.stringify(state.opened));
  }catch(e){}
}
const state = {
  words: load("words", DEFAULT_WORDS),
  key: load("key", DEFAULT_KEY),
  start: load("start", "R"),
  opened: load("opened", Array(25).fill(false)),
  view: "table",
  edit: false,
  busy: ""
};

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---------- отрисовка ----------
function render(){
  const counts = {}, left = {};
  ORDER.forEach(k => {
    counts[k] = state.key.filter(x => x === k).length;
    left[k] = state.key.filter((x,i) => x === k && !state.opened[i]).length;
  });

  const pill = $("startPill");
  pill.textContent = state.start === "R" ? "красные" : "синие";
  pill.style.background = COLORS[state.start].bg;

  $("scoreRow").innerHTML = ORDER.map(k =>
    `<div class="score" style="background:${COLORS[k].bg};color:${COLORS[k].fg}">
       <span class="scoreNum">${left[k]}</span><span class="scoreOf">из ${counts[k]}</span></div>`).join("");

  ["btnWords","btnKey","btnRotate"].forEach(id => $(id).disabled = !!state.busy);
  $("btnEdit").textContent = state.edit ? "Готово" : "Исправить слова";
  $("btnEdit").classList.toggle("on", state.edit);

  $("noteBusy").textContent = state.busy;
  $("noteBusy").classList.toggle("hidden", !state.busy);

  const odd = counts.K !== 1 || counts.Y !== 7 || counts.R + counts.B !== 17;
  $("noteWarn").classList.toggle("hidden", !odd || !!state.busy);
  $("noteWarn").textContent = `В ключе должно быть 9 + 8 цветных, 7 жёлтых и 1 чёрная. Сейчас: ${counts.R} красных, ${counts.B} синих, ${counts.Y} жёлтых, ${counts.K} чёрных — проверьте клетки.`;

  $("tabTable").classList.toggle("active", state.view === "table");
  $("tabLists").classList.toggle("active", state.view === "lists");
  $("editor").classList.toggle("hidden", !state.edit);
  $("tabs").classList.toggle("hidden", state.edit);
  $("viewTable").classList.toggle("hidden", state.edit || state.view !== "table");
  $("viewLists").classList.toggle("hidden", state.edit || state.view !== "lists");

  $("hint").textContent = "Нажмите на карточку, когда её открыли — она потускнеет.";

  $("grid").innerHTML = state.words.map((w,i) => {
    const c = COLORS[state.key[i]];
    const style = `background:${c.bg};color:${c.fg};box-shadow:inset 0 0 0 2px ${c.ring}55`;
    return `<div class="card${state.opened[i] ? " opened" : ""}" data-i="${i}" tabindex="0" style="${style}">
      <span class="word${w.length > 9 ? " long" : ""}">${esc(w)}</span></div>`;
  }).join("");

  if (state.edit && !$("editList").dataset.built){
    let html = "";
    for (let r = 0; r < 5; r++){
      html += `<div class="editRow"><h3>Ряд ${r+1}</h3>`;
      for (let c = 0; c < 5; c++){
        const i = r*5 + c;
        html += `<div class="editItem">
          <button class="swatch" data-i="${i}" aria-label="Сменить цвет" style="background:${COLORS[state.key[i]].bg}"></button>
          <input class="wordEdit" data-i="${i}" value="${esc(state.words[i])}" autocapitalize="characters" spellcheck="false">
        </div>`;
      }
      html += `</div>`;
    }
    $("editList").innerHTML = html;
    $("editList").dataset.built = "1";
  }
  if (!state.edit) delete $("editList").dataset.built;

  $("lists").innerHTML = ORDER.map(k => {
    const items = state.words.map((w,i) => ({w,i})).filter(({i}) => state.key[i] === k);
    return `<div class="list" style="border-color:${COLORS[k].bg}">
      <h2 style="background:${COLORS[k].bg};color:${COLORS[k].fg}">${COLORS[k].name} <span>${items.length}</span></h2>
      <ul>${items.map(({w,i}) => `<li data-i="${i}" tabindex="0" class="${state.opened[i] ? "opened" : ""}">${esc(w)}</li>`).join("")}</ul>
    </div>`;
  }).join("");
}

function showError(msg){
  $("noteErr").textContent = msg;
  $("noteErr").classList.toggle("hidden", !msg);
}
function toggleOpened(i){ state.opened[i] = !state.opened[i]; save(); render(); }

// ---------- события ----------
$("startPill").onclick = () => { state.start = state.start === "R" ? "B" : "R"; save(); render(); };
$("btnEdit").onclick = () => { state.edit = !state.edit; render(); };
$("btnRotate").onclick = () => {
  const k = state.key, out = new Array(25);
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) out[r*5+c] = k[(4-c)*5+r];
  state.key = out; save(); render();
};
$("tabTable").onclick = () => { state.view = "table"; render(); };
$("tabLists").onclick = () => { state.view = "lists"; render(); };

$("grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) toggleOpened(+card.dataset.i);
});
$("grid").addEventListener("keydown", e => {
  const card = e.target.closest(".card[data-i]");
  if (card && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleOpened(+card.dataset.i); }
});
$("editList").addEventListener("click", e => {
  const sw = e.target.closest(".swatch");
  if (!sw) return;
  const i = +sw.dataset.i;
  state.key[i] = ORDER[(ORDER.indexOf(state.key[i]) + 1) % ORDER.length];
  sw.style.background = COLORS[state.key[i]].bg;
  save(); render();
});
$("editList").addEventListener("input", e => {
  if (e.target.classList.contains("wordEdit")){
    state.words[+e.target.dataset.i] = e.target.value.trim().toUpperCase(); save();
  }
});
$("btnDone").onclick = () => { state.edit = false; render(); };
$("lists").addEventListener("click", e => {
  const li = e.target.closest("li[data-i]");
  if (li) toggleOpened(+li.dataset.i);
});

// ---------- распознавание фото ----------
async function fileToBase64(file, max = 1600){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("не удалось открыть фото")); i.src = url;
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}

async function askClaude(base64, mode){
  let response;
  try{
    response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode, image: base64 })
    });
  }catch(e){
    throw new Error("нет связи с сервером распознавания");
  }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || ("ошибка сервера " + response.status));
  const text = String(data.text || "").replace(/```json|```/g, "").trim();
  return JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
}

$("btnWords").onclick = () => $("fileWords").click();
$("btnKey").onclick = () => $("fileKey").click();

$("fileWords").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  showError(""); state.busy = "Читаю слова на карточках…"; render();
  try{
    const res = await askClaude(await fileToBase64(file), "words");
    const flat = (res.words || []).flat().map(w => String(w).trim().toUpperCase());
    if (flat.length !== 25) throw new Error(`распознано ${flat.length} слов вместо 25`);
    state.words = flat; state.opened = Array(25).fill(false); save();
  }catch(err){
    showError(`Слова не распознаны: ${err.message}. Сфотографируйте все 25 карточек сверху или поправьте слова вручную.`);
  }finally{ state.busy = ""; render(); }
};

$("fileKey").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  showError(""); state.busy = "Читаю карту-ключ…"; render();
  try{
    const res = await askClaude(await fileToBase64(file), "key");
    const flat = (res.grid || []).flat().map(x => String(x).toUpperCase());
    if (flat.length !== 25 || flat.some(x => !ORDER.includes(x))) throw new Error("сетка распознана не полностью");
    state.key = flat;
    if (res.start === "R" || res.start === "B") state.start = res.start;
    save();
  }catch(err){
    showError(`Карта-ключ не распознана: ${err.message}. Снимите её ровно и крупно или раскрасьте клетки вручную.`);
  }finally{ state.busy = ""; render(); }
};

render();
</script>
</body>
</html>
